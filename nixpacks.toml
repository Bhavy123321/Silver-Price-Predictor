[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python -m venv /app/.venv",
  ". /app/.venv/bin/activate",
  "pip install --upgrade pip setuptools wheel",
  "pip install -r requirements.txt"
]

[phases.start]
cmd = ". /app/.venv/bin/activate && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120"
