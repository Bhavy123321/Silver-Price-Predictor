<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silver Predictor</title>

  <!-- IMPORTANT: Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ MAIN CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- ✅ Chart.js (REQUIRED) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">Silver Predictor</div>
      <div class="tagline">AI Direction Forecast • Purity • State Premium</div>
    </div>

    <nav class="nav">
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('reviews') }}">Reviews</a>
      <a href="{{ social.github }}" target="_blank">GitHub</a>
      <a href="{{ social.linkedin }}" target="_blank">LinkedIn</a>
    </nav>
  </header>

  <!-- PAGE CONTENT -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER NOTE -->
  <footer class="footer-note">
    ⚠️ All prices are AI-based estimates using historical trends and live market data. Not guaranteed.
  </footer>

</body>
</html>
