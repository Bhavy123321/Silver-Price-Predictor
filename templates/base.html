<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Silver Predictor</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ cache_bust }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="brand-title">Silver Predictor</div>
        <div class="brand-sub">AI Direction Forecast • Purity • State Premium</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('about') }}">About</a>
      <a class="nav-link" href="{{ url_for('reviews') }}">Reviews</a>

      <a class="pill" href="{{ social.github }}" target="_blank" rel="noopener">GitHub</a>
      <a class="pill" href="{{ social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>

      <button class="pill pill-toggle" id="themeToggle" type="button">
        <span class="moon">🌙</span><span class="toggle-text">Dark</span>
      </button>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div>© <span id="year"></span> Silver Predictor • Built with Flask + ML</div>
    <div class="footer-links">
      <a class="footer-link" href="{{ url_for('index') }}">Dashboard</a>
      <a class="footer-link" href="{{ url_for('about') }}">About</a>
      <a class="footer-link" href="{{ url_for('reviews') }}">Reviews</a>
      <a class="footer-link" href="{{ social.github }}" target="_blank" rel="noopener">GitHub</a>
      <a class="footer-link" href="{{ social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>

  <script defer src="{{ url_for('static', filename='app.js') }}?v={{ cache_bust }}"></script>
</body>
</html>
