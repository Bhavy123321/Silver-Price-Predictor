<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Silver Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="brand-title">Silver Predictor</div>
        <div class="brand-sub">AI Direction Forecast • Purity • State Premium</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/about">About</a>
      <a class="nav-link" href="/reviews">Reviews</a>

      <a class="pill" href="#" id="githubLink" aria-label="GitHub">GitHub</a>
      <a class="pill" href="#" id="linkedinLink" aria-label="LinkedIn">LinkedIn</a>

      <button class="pill pill-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <span class="moon">🌙</span>
        <span class="toggle-text">Dark</span>
      </button>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div>© <span id="year"></span> Silver Predictor • Built with Flask + ML</div>
    <div class="footer-links">
      <a href="/" class="footer-link">Dashboard</a>
      <a href="/about" class="footer-link">About</a>
      <a href="/reviews" class="footer-link">Reviews</a>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
