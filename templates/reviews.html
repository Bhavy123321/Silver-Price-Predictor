{% extends "base.html" %}
{% block content %}

<div class="grid2">
  <div class="card page-card">
    <div class="card-title">Leave a Review</div>
    <form method="POST" class="review-form">
      <input name="name" placeholder="Your name" required />
      <select name="rating">
        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
        <option value="4">⭐⭐⭐⭐ (4)</option>
        <option value="3">⭐⭐⭐ (3)</option>
        <option value="2">⭐⭐ (2)</option>
        <option value="1">⭐ (1)</option>
      </select>
      <textarea name="message" placeholder="Your feedback..." required></textarea>
      <button class="btn-primary" type="submit">Submit Review</button>
    </form>
  </div>

  <div class="card page-card">
    <div class="card-title">Recent Reviews</div>
    {% if reviews and reviews|length %}
      <div class="review-list">
        {% for r in reviews %}
          <div class="review-item">
            <div class="review-head">
              <b>{{ r[0] }}</b>
              <span class="muted">⭐ {{ r[1] }}/5 • {{ r[3] }}</span>
            </div>
            <div class="muted">{{ r[2] }}</div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="muted">No reviews yet. Be the first 😊</div>
    {% endif %}
  </div>
</div>

{% endblock %}
